spring:
  application:
    name: capstone-tracking-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capstone_tracking}
    username: ${DB_USERNAME:capstone_user}
    password: ${DB_PASSWORD:capstone_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Kept deliberately small: NFR-002's 50-concurrent-groups scenario is a burst of short
      # row-locked transactions, not 50 held-open connections — a big pool just means more
      # requests queuing on the same Postgres row lock instead of at the pool. Tune with real load.
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # Must stay >= app.storage.max-file-size; oversize requests are rejected here with 413 before reaching a controller.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}

  # Caching backend: none (default), redis (set REDIS_ENABLED too) or simple (in-memory).
  cache:
    type: ${CACHE_TYPE:none}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  # SMTP for email notifications; only used when app.mail.enabled=true (e.g. Gmail + app password).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-key-please-override-in-prod-min-32-bytes}
    access-token-exp-minutes: ${JWT_ACCESS_EXP_MIN:60}
    refresh-token-exp-days: ${JWT_REFRESH_EXP_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  # Feature switches for the infrastructure tier. Defaults need nothing but Postgres (what Railway runs today);
  # docker-compose turns them all on against Floci (S3 + SQS) and Redis.
  redis:
    enabled: ${REDIS_ENABLED:false}
  aws:
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_ENDPOINT_URL:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  messaging:
    type: ${MESSAGING_TYPE:inprocess}
    sqs:
      queue-name: ${SQS_QUEUE_NAME:capstone-domain-events}
      create-queue: ${SQS_CREATE_QUEUE:false}
      wait-time-seconds: ${SQS_WAIT_TIME_SECONDS:10}
  storage:
    type: ${STORAGE_TYPE:local}
    s3:
      bucket: ${S3_BUCKET:capstone-documents}
      create-bucket: ${S3_CREATE_BUCKET:false}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
    allowed-extensions: pdf,doc,docx,ppt,pptx,xls,xlsx,zip,rar,png,jpg,jpeg,txt,md
  security:
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:fpt.edu.vn,gmail.com}
  # Google Workspace sign-in (POST /api/v1/auth/google): the OAuth client id(s) the FE's Google button uses.
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  # Email notifications to the group (To leader, CC members + supervisor). Off = logged only.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:capstone-tracking@fpt.edu.vn}
  # Giai đoạn 6 "cuốn chiếu": how many final defenses may run at the same time.
  defense:
    max-parallel: ${DEFENSE_MAX_PARALLEL:5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.capstone.tracking: DEBUG
    org.springframework.security: INFO
