spring:
  datasource:
    url: jdbc:h2:mem:capstone_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-secret-key-must-be-at-least-32-bytes-long
    access-token-exp-minutes: 60
    refresh-token-exp-days: 7
  storage:
    local-dir: target/test-uploads
  security:
    allowed-email-domain: fpt.edu.vn,gmail.com
