spring:
  datasource:
    url: jdbc:h2:mem:capstone_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  messaging:
    dispatch-delay-ms: 3600000
  auth:
    password-login-enabled: true
  jwt:
    secret: test-only-secret-key-must-be-at-least-32-bytes-long
    access-token-exp-minutes: 60
    refresh-token-exp-days: 7
  mail:
    # Tests dispatch the email outbox explicitly (TestSupport.dispatchEmails) instead of on a timer.
    dispatch-delay-ms: 3600000
  formation:
    # Tests run the automatic transitions themselves (ScopeService.tick) instead of on a timer.
    tick-ms: 3600000
