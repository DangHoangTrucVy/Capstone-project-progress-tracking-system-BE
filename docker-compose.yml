services:
  postgres:
    image: postgres:16-alpine
    container_name: capstone-tracking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: capstone_tracking
      POSTGRES_USER: capstone_user
      POSTGRES_PASSWORD: capstone_pass
    ports:
      - "5432:5432"
    volumes:
      - capstone_tracking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone_user -d capstone_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Floci: local AWS emulator (S3 for documents, SQS for domain events). Console: http://localhost:4566/_floci/ui
  floci:
    image: floci/floci:latest
    container_name: capstone-tracking-floci
    restart: unless-stopped
    environment:
      FLOCI_STORAGE_MODE: hybrid          # keep buckets/queues across restarts
      FLOCI_STORAGE_PERSISTENT_PATH: /data
    ports:
      - "4566:4566"
    volumes:
      - capstone_tracking_floci:/data

  redis:
    image: redis:7-alpine
    container_name: capstone-tracking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-tracking-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/capstone_tracking
      DB_USERNAME: capstone_user
      DB_PASSWORD: capstone_pass
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-key-please-override-in-prod-min-32-bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-fpt.edu.vn}
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-capstone-tracking@fpt.edu.vn}
      STORAGE_LOCAL_DIR: /app/uploads
      # Infrastructure tier: S3 + SQS on Floci, cache + login rate limit on Redis.
      STORAGE_TYPE: s3
      S3_CREATE_BUCKET: "true"
      MESSAGING_TYPE: sqs
      SQS_CREATE_QUEUE: "true"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      CACHE_TYPE: redis
    ports:
      - "8080:8080"
    volumes:
      - capstone_tracking_uploads:/app/uploads

volumes:
  capstone_tracking_data:
  capstone_tracking_uploads:
  capstone_tracking_floci:
