name: CI

# Every PR into main and every push to main: full test suite, including the infrastructure tests that run against
# Floci (S3 + SQS) and Redis service containers, then a Docker build. Railway deploys main, so a red run here
# means "do not merge".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INFRA_TESTS: "true"
      AWS_ENDPOINT_URL: http://localhost:4566
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for Floci
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/ > /dev/null && exit 0
            sleep 2
          done
          echo "Floci did not come up" && exit 1

      - name: Test
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (same Dockerfile Railway uses)
        run: docker build -t capstone-tracking-backend:ci .
